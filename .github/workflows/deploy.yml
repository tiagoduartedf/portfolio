# Builds the Next.js static export and publishes it to GitHub Pages on
# every push to master. Manual triggers are also allowed via the Actions
# tab. Setup: repo Settings → Pages → "Build and deployment" → Source =
# "GitHub Actions". First successful run will provision the
# `github-pages` environment automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Minimum permissions the official Pages actions require.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys: a newer push cancels an in-flight run for the same
# branch instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_BASE_PATH puts the site under /portfolio (project
        # pages live at tiagoduartedf.github.io/portfolio). The same
        # variable is read by app/lib/basePath.ts so raw asset paths
        # stay in sync with Next's own basePath option.
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
