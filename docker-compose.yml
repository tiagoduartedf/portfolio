services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    # NODE_ENV intentionally not set: Next picks the right value per
    # command (dev sets development, build sets production), so
    # `docker compose exec web npm run build` works without an override.
    command: ["npx", "next", "dev", "-H", "0.0.0.0", "-p", "3003"]
    init: true

  # Local preview of the static export. Behind the `preview` profile so
  # the default `docker compose up` brings only dev. Bring it up with
  #   docker compose --profile preview up -d
  # and visit http://localhost:4003. The command rebuilds before
  # serving in one shot, so you don't have to remember a separate
  # build step; to rebuild after a code change, run
  #   docker compose restart preview
  # which re-executes the command on the same container.
  # Shares the `web` image and node_modules volume so deps install once;
  # .next isn't mounted because `serve` only needs ./out. The build is
  # local-only so NEXT_PUBLIC_BASE_PATH is left unset, which serves the
  # site at the host root; the CI build sets it to "/portfolio" because
  # Pages publishes the repo under that subpath.
  preview:
    profiles: ["preview"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    ports:
      - "4003:4003"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    command:
      - "sh"
      - "-c"
      - |
        echo '==> Building static export (takes ~25s, wait for the "Accepting connections" line)...' &&
        npm run build &&
        echo '==> Build done. Serving at http://localhost:4003' &&
        npx serve out -l 4003
    init: true

volumes:
  node_modules:
  next_cache:
